<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#24304d">
    <title>Offline - Outreach Console</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf9f6; color: #1c2333; font: 16px system-ui, sans-serif; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.5rem; }
      p { line-height: 1.6; color: #6b7280; }
      button { border: 0; border-radius: .5rem; padding: .75rem 1rem; background: #24304d; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet to access your CRM. Private lead and activity data is never stored for offline use.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
